# Occasion — served at https://<host>/occasion/   (static app + a few PHP endpoints; no front controller)
# Adjust /var/www/occasion to wherever you put the folder. Do NOT use FallbackResource: there is no index.php.

Alias /occasion /var/www/occasion

<Directory /var/www/occasion>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.html

    # --- PHP: only if your server does not already handle *.php globally (php-fpm example) ---
    # <FilesMatch "\.php$">
    #     SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
    # </FilesMatch>

    # Service worker must be allowed to control the whole folder and must never be served stale.
    <Files "sw.js">
        Header set Service-Worker-Allowed "/occasion/"
        Header set Cache-Control "no-cache"
    </Files>

    # --- Lock down server-side internals ---
    # (access.sqlite holds registered phone numbers: it must never be downloadable)
    <FilesMatch "\.(sqlite|sqlite3|db|env|tmp)$">
        Require all denied
    </FilesMatch>
    # libraries and CLI scripts are not endpoints; only hymns.php, check_access.php and admin.php are
    <FilesMatch "^(hymns_lib|db|sync)\.php$">
        Require all denied
    </FilesMatch>
</Directory>

<DirectoryMatch "^/var/www/occasion/api/(cache|tests)(/|$)">
    Require all denied
</DirectoryMatch>
